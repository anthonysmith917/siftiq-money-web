<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiftIQ Money Live Demo</title>
    <style>
      html, body { height: 100%; margin: 0; background: #070b09; color: #f4fff8; font-family: "Segoe UI", Arial, sans-serif; }
      body { display: grid; place-items: center; }
      .loader { display: grid; justify-items: center; gap: 14px; }
      .loader span { width: 34px; height: 34px; border: 3px solid rgba(120,240,173,.2); border-top-color: #23d66f; border-radius: 50%; animation: spin .8s linear infinite; }
      .loader p { margin: 0; color: #a8b8af; font-size: 13px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="loader"><span></span><p>Loading SiftIQ Money demo...</p></div>
    <script>
      (async () => {
        const files = Array.from({ length: 22 }, (_, index) => `parts/chunk-${String(index).padStart(2, "0")}.txt`);
        const chunks = await Promise.all(files.map(async (file) => {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`Unable to load ${file}`);
          return response.text();
        }));
        const binary = atob(chunks.join(""));
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        let html = new TextDecoder().decode(bytes);
        html = html.replace('data-theme="blue"', 'data-theme="dark"');
        html = html.replaceAll('#2f8cff', '#23d66f').replaceAll('#1f6fd6', '#19a857').replaceAll('rgba(47,140,255', 'rgba(35,214,111');
        html = html.replace('<option value="blue" selected>Blue</option>', '<option value="blue">Blue</option>');
        html = html.replace('<option value="dark">Dark</option>', '<option value="dark" selected>Dark</option>');
        const layoutFix = `<style id="demo-layout-fix">
          html{height:auto!important;min-height:100%!important;overflow-y:scroll!important;scroll-behavior:smooth}
          body{height:auto!important;min-height:100vh!important;overflow:visible!important;background:radial-gradient(1100px 650px at 12% -8%,rgba(35,214,111,.12),transparent 60%),linear-gradient(180deg,#050806,#070b09)!important}
          .demo-banner,.app-window,.cta-section,.page-foot{flex:0 0 auto!important}
          [data-theme="blue"],[data-theme="dark"]{--bg:#070b09;--bg2:#050806;--panel:#0e1511;--panel2:#111b16;--panel3:#17231c;--border:rgba(140,203,166,.14);--border2:rgba(140,203,166,.24);--text:#f4fff8;--muted:#a8b8af;--muted2:#72857a;--blue:#23d66f;--blue-d:#19a857;--green:#23d66f;--green-d:#1da862;--titlebar:#07110d;--sidebar:#09110d;--input:#0b1410}
          [data-theme="blue"] body,[data-theme="dark"] body{background:radial-gradient(1100px 650px at 12% -8%,rgba(35,214,111,.12),transparent 60%),linear-gradient(180deg,#050806,#070b09)!important}
          [data-theme="blue"] .cta-section,[data-theme="dark"] .cta-section{background:linear-gradient(135deg,rgba(14,32,24,.98),rgba(7,15,11,.98))!important}
          [data-theme="blue"] .cta-section h2 .grad,[data-theme="dark"] .cta-section h2 .grad,[data-theme="blue"] .upg-modal h2 .grad,[data-theme="dark"] .upg-modal h2 .grad{background:linear-gradient(90deg,#78f0ad,#23d66f)!important;-webkit-background-clip:text!important;background-clip:text!important}
          [data-theme="blue"] .nav-item.active,[data-theme="dark"] .nav-item.active{background:rgba(35,214,111,.14)}
          [data-theme="blue"] .page-ico,[data-theme="dark"] .page-ico,[data-theme="blue"] .bank-badge,[data-theme="dark"] .bank-badge,[data-theme="blue"] .acc-badge,[data-theme="dark"] .acc-badge{background:rgba(35,214,111,.12)}
          ::-webkit-scrollbar-thumb{background:rgba(35,214,111,.28)!important}
          @media (max-width:760px){
            html{overflow-x:hidden!important;background:#070b09!important}
            body{display:block!important;padding:0!important;min-width:0!important;background:#070b09!important}
            .demo-banner,.cta-section,.page-foot{display:none!important}
            .app-window{width:100%!important;height:auto!important;min-height:100dvh!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}
            .titlebar{height:76px!important;min-height:76px!important;padding:0 16px!important;background:#070b09!important;border-bottom:1px solid var(--border)!important;gap:10px!important}
            .titlebar img{width:36px!important;height:36px!important;order:3;margin-left:auto;border-radius:50%!important}
            .titlebar .t{font-size:24px!important;font-weight:650!important;order:1}
            .titlebar .sp,.tb-upgrade,.win-btns{display:none!important}
            .app-body{display:block!important;min-height:calc(100dvh - 76px)!important}
            .main{overflow:visible!important;padding:20px 16px calc(104px + env(safe-area-inset-bottom))!important}
            .page-head{margin-bottom:18px!important;gap:10px!important;align-items:center!important}
            .page-head .page-ico{display:none!important}
            .page-title{font-size:25px!important;letter-spacing:0!important}
            .page-sub{font-size:13px!important}
            .head-actions{width:100%!important;margin-left:0!important;gap:8px!important}
            .head-actions .pill{padding:7px 11px!important;font-size:12px!important}
            .head-actions .avatar{display:none!important}
            .btn{padding:8px 12px!important}
            .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;margin-bottom:12px!important}
            .stat-card{padding:14px!important;border-width:1px!important}
            .stat-ico{width:36px!important;height:36px!important;flex-basis:36px!important}
            .stat-ico svg{width:19px!important;height:19px!important}
            .stat-value{font-size:22px!important;letter-spacing:0!important}
            .stat-sub{font-size:11px!important}
            .grid-2,.grid-3{grid-template-columns:1fr!important;gap:12px!important;margin-bottom:12px!important}
            .panel{padding:16px!important;border-radius:8px!important}
            .panel-title{font-size:16px!important}
            .tblwrap{border-radius:8px!important}
            table.grid{min-width:680px!important}
            .txn-card{padding:12px!important;gap:10px!important;border-radius:8px!important}
            .txn-card .mid{display:none!important}
            .tdate{display:none!important}
            .tamt{width:auto!important;flex-basis:auto!important}
            .cal-grid{gap:5px!important}
            .day-cell{padding:7px!important;min-height:68px!important}
            .badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
            .badge-card{padding:18px 10px!important;border-radius:8px!important}
            .syncbar{flex-wrap:wrap!important}
            .slide-panel{position:fixed!important;width:100%!important;top:0!important;bottom:0!important}
            .modal-ov,.slide-ov,.unlock-ov{position:fixed!important}
            .modal{width:calc(100% - 28px)!important;padding:20px!important}
            .sidebar{position:fixed!important;z-index:1000!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:76px!important;padding:6px 8px calc(6px + env(safe-area-inset-bottom))!important;border:0!important;border-top:1px solid var(--border2)!important;background:rgba(9,17,13,.97)!important;backdrop-filter:blur(16px)!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:2px!important;overflow:hidden!important}
            .nav-item{display:none!important;height:62px!important;padding:7px 2px!important;border-radius:8px!important;gap:3px!important;font-size:10px!important;line-height:1!important;justify-content:center!important}
            .nav-item[data-screen="home"],.nav-item[data-screen="accounts"],.nav-item[data-screen="transactions"],.nav-item[data-screen="bills"],.nav-item[data-screen="insights"]{display:flex!important}
            .nav-item[data-screen="home"]{order:1}.nav-item[data-screen="accounts"]{order:2}.nav-item[data-screen="transactions"]{order:3}.nav-item[data-screen="bills"]{order:4}.nav-item[data-screen="insights"]{order:5}
            .nav-item[data-screen="transactions"]{font-size:0!important}
            .nav-item[data-screen="transactions"]::after{content:"Activity";font-size:10px!important}
            .nav-item svg{width:22px!important;height:22px!important}
            .nav-item.active::before{display:none!important}
            .nav-item.active{background:rgba(35,214,111,.13)!important;color:var(--blue)!important}
            .demo-back-link{top:auto!important;left:auto!important;right:12px!important;bottom:88px!important;width:42px!important;height:42px!important;padding:0!important;justify-content:center!important;border-radius:50%!important;font-size:0!important}
            .demo-back-link::after{content:"\\2190";font-size:20px!important}
          }
        </style>`;
        const backLink = `<a class="demo-back-link" href="../" aria-label="Back to SiftIQ Money" title="Back to SiftIQ Money" style="position:fixed;left:18px;top:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(7,17,13,.9);border:1px solid rgba(120,240,173,.3);box-shadow:0 12px 30px rgba(0,0,0,.32);color:#f4fff8;text-decoration:none;font:600 12.5px/1.2 'Segoe UI',Arial,sans-serif;backdrop-filter:blur(8px)">← Back to SiftIQ Money</a>`;
        html = html.includes("</head>") ? html.replace("</head>", `${layoutFix}</head>`) : `${layoutFix}${html}`;
        html = html.includes("</body>") ? html.replace("</body>", `${backLink}</body>`) : `${html}${backLink}`;
        document.open();
        document.write(html);
        document.close();
      })().catch((error) => {
        document.body.innerHTML = `<p>Unable to load the SiftIQ Money demo: ${error.message}</p>`;
      });
    </script>
  </body>
</html>
