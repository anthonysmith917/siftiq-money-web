<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiftIQ Money Live Demo</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0a1424; color: #eaf1f8; font-family: "Segoe UI", Arial, sans-serif; }
      body { display: grid; place-items: center; }
      .loader { display: grid; justify-items: center; gap: 14px; }
      .loader span { width: 34px; height: 34px; border: 3px solid rgba(148,184,220,.22); border-top-color: #2f8cff; border-radius: 50%; animation: spin .8s linear infinite; }
      .loader p { margin: 0; color: #8fa1b8; font-size: 13px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="loader"><span></span><p>Loading SiftIQ Money demo...</p></div>
    <script>
      (async () => {
        const files = Array.from({ length: 22 }, (_, index) => `parts/chunk-${String(index).padStart(2, "0")}.txt`);
        const chunks = await Promise.all(files.map(async (file) => {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`Unable to load ${file}`);
          return response.text();
        }));
        const binary = atob(chunks.join(""));
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        let html = new TextDecoder().decode(bytes);
        const backLink = `<a href="../" style="position:fixed;left:18px;top:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(10,20,36,.86);border:1px solid rgba(148,184,220,.28);box-shadow:0 12px 30px rgba(0,0,0,.32);color:#eaf1f8;text-decoration:none;font:600 12.5px/1.2 'Segoe UI',Arial,sans-serif;backdrop-filter:blur(8px)">← Back to SiftIQ Money</a>`;
        html = html.includes("</body>") ? html.replace("</body>", `${backLink}</body>`) : `${html}${backLink}`;
        document.open();
        document.write(html);
        document.close();
      })().catch((error) => {
        document.body.innerHTML = `<p>Unable to load the SiftIQ Money demo: ${error.message}</p>`;
      });
    </script>
  </body>
</html>
